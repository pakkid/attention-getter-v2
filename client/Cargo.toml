[package]
name = "attention-getter"
version = "1.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "process", "io-util", "sync", "fs", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2"] }
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.17"
egui = "0.36"
egui_glow = { version = "0.36", features = ["winit"] }
egui-winit = { version = "0.36", default-features = false }
raw-window-handle = "0.6"
gif = "0.14"
rodio = { version = "0.22", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav"] }
global-hotkey = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# TLS: rustls on Linux (no OpenSSL dependency), the OS's schannel on Windows.
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
