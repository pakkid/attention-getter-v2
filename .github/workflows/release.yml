name: release

# Push a tag like v0.1.0 to build the clients and publish a GitHub release.
# Run manually (Actions → release → Run workflow) to build and test without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        working-directory: server
        run: go vet ./... && go test -race ./...
      - name: Build Docker image (checks the Dockerfile Portainer uses)
        run: docker build -t attention-getter-v2:ci server

  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc, so the binary runs on most distros
            target: x86_64-unknown-linux-gnu
            bin: attention-getter
            asset: attention-getter-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: attention-getter.exe
            asset: attention-getter-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: ${{ matrix.target }}
      - name: Test
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ../${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
